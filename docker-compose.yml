# Local WordPress sandbox on any PHP version with an official image tag
# (wordpress:php<version>-apache). Settings come from .env (see .env.example).
#
#   PHP_VERSION=8.4 docker compose up -d
#   docker compose run --rm cli wp <command>
#
# SITE_DIR points at the wp-content you are testing: ./demo (the bundled demo
# site) or ./site (your own site, pulled with bin/pull-site.sh).
name: wp-php-upgrade-lab

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX:-wp_}
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', '/tmp/wp-debug.log' );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'DISABLE_WP_CRON', true );

x-wp-volumes: &wp-volumes
  - wp-core:/var/www/html
  - ${SITE_DIR:-./demo}/wp-content/themes:/var/www/html/wp-content/themes
  - ${SITE_DIR:-./demo}/wp-content/plugins:/var/www/html/wp-content/plugins

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  wordpress:
    image: wordpress:php${PHP_VERSION:-8.4}-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only: the sandbox holds a copy of a production database.
      - "127.0.0.1:${LAB_PORT:-8083}:80"
    environment: *wp-env
    volumes: *wp-volumes

  cli:
    image: wordpress:cli-php${PHP_VERSION:-8.4}
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-env
    volumes: *wp-volumes

volumes:
  db-data:
  wp-core:
